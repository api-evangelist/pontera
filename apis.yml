aid: pontera
name: Pontera
description: 'Pontera (formerly FeeX; legal entity Pontera Solutions Inc.) is a wealthtech
  platform that lets financial advisors securely manage, rebalance, and report on
  clients'' held-away workplace-sponsored retirement accounts — 401(k), 401(a), 403(b),
  457, TSP, and certain 529 plans — without a rollover. Accounts connect through a
  client-permissioned, credential-free workflow designed to avoid triggering custody
  under SEC Rule 206(4)-2, with an un-editable audit log for supervision. Pontera integrates
  with portfolio-management, reporting, billing, and supervision systems (Orion, Addepar,
  Black Diamond, Morningstar and others) but publishes no public developer API. Backed
  by ICONIQ Capital and Lightspeed Venture Partners.'
